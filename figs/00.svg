<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" preserveAspectRatio="xMidYMid meet" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
<title>抛物线平移：y = x² 向右 2、向上 1 得到 y = (x−2)² + 1</title>
<desc>左边是示意图：原图上的点 (0,0) 移动 (2,1) 得到 (2,1)。右边是同一个坐标系里两条曲线，横向平移 2 格、纵向平移 1 格。</desc>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<text x="44" y="34" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#1f2430" font-weight="600">先看点怎么走</text>
<text x="44" y="54" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">每一个点都往右 2、往上 1</text>
<circle cx="96" cy="150" r="26" fill="#f4f6fa" stroke="#2f5d8a" stroke-width="1.6"/>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="91.2" y="155" font-size="15" fill="#2f5d8a">P</text></g>
<text x="96" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">原图上的点</text>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="78.12" y="214" font-size="12" fill="#5b6472">(0, 0)</text></g>
<line x1="132" y1="150" x2="236" y2="150" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/>
<path d="M236,150 L227,145.4 L227,154.6 Z" fill="#c0392b"/>
<line x1="236" y1="150" x2="236" y2="92" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/>
<path d="M236,92 L231.4,101 L240.6,101 Z" fill="#c0392b"/>
<text x="186" y="140" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#c0392b" font-weight="600" text-anchor="middle">右 2</text>
<text x="244" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#c0392b">上 1</text>
<circle cx="236" cy="92" r="26" fill="#fdf0ec" stroke="#c0392b" stroke-width="1.8"/>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="228.95" y="97" font-size="15" fill="#c0392b">P'</text></g>
<text x="272" y="92" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#c0392b">新图上的对应点</text>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="272" y="110" font-size="12" fill="#c0392b">(2, 1)</text></g>
<text x="44" y="258" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">括号里 −2：横坐标先减 2，才能找回原图上的点。</text>
<text x="44" y="278" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">括号外 +1：整体往上抬 1 格，直接加在 y 上。</text>
<line x1="44" y1="296" x2="412" y2="296" stroke="#e3e7ee" stroke-width="1"/>
<text x="44" y="320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#8a93a3">竖向缩放不同，所以「形」看起来有点被拉长；</text>
<text x="44" y="338" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#8a93a3">平移只看顶点和方向，不看胖瘦。</text>
