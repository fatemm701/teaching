<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" preserveAspectRatio="xMidYMid meet" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
<title>数轴的三个要素</title>
<desc>数轴有三样东西：原点、正方向、单位长度。原点右边是正数，左边是负数，越往右的数越大。</desc>
<rect x="0" y="0" width="720" height="230" fill="#ffffff"/>
<line x1="56" y1="132" x2="664" y2="132" stroke="#1f2430" stroke-width="2"/>
<path d="M664,132 L655,127.4 L655,136.6 Z" fill="#1f2430"/>
<line x1="56" y1="125" x2="56" y2="139" stroke="#1f2430" stroke-width="1.6"/>
<text x="56" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">-1</text>
<line x1="144" y1="125" x2="144" y2="139" stroke="#1f2430" stroke-width="1.6"/>
<text x="144" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#1f2430" font-weight="600" text-anchor="middle">0</text>
<line x1="232" y1="125" x2="232" y2="139" stroke="#1f2430" stroke-width="1.6"/>
<text x="232" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">1</text>
<line x1="320" y1="125" x2="320" y2="139" stroke="#1f2430" stroke-width="1.6"/>
<text x="320" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">2</text>
<line x1="408" y1="125" x2="408" y2="139" stroke="#1f2430" stroke-width="1.6"/>
<text x="408" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">3</text>
<line x1="496" y1="125" x2="496" y2="139" stroke="#1f2430" stroke-width="1.6"/>
<text x="496" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">4</text>
<line x1="584" y1="125" x2="584" y2="139" stroke="#1f2430" stroke-width="1.6"/>
<text x="584" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">5</text>
<text x="128" y="178" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#1f2430" font-weight="600" text-anchor="end">原点 O</text>
<line x1="408" y1="106" x2="496" y2="106" stroke="#c0392b" stroke-width="1.6"/>
<line x1="408" y1="100" x2="408" y2="112" stroke="#c0392b" stroke-width="1.6"/>
<line x1="496" y1="100" x2="496" y2="112" stroke="#c0392b" stroke-width="1.6"/>
<text x="452" y="94" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#c0392b" font-weight="600" text-anchor="middle">单位长度</text>
<line x1="548.8" y1="102" x2="619.2" y2="102" stroke="#2f5d8a" stroke-width="1.6"/>
<path d="M619.2,102 L610.2,97.4 L610.2,106.6 Z" fill="#2f5d8a"/>
<text x="584" y="92" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#2f5d8a" font-weight="600" text-anchor="middle">正方向</text>
<text x="56" y="34" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#1f2430" font-weight="600">三要素：原点 · 正方向 · 单位长度</text>
<text x="56" y="56" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">左边是负数，右边是正数，越往右的数越大。</text>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="56" y="208" font-size="13" fill="#1f2430">−2 &lt; −0.5 &lt; 0 &lt; 1 &lt; 4</text></g>
<text x="420" y="208" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">数轴上，右边的数永远比左边大</text>
</svg>
