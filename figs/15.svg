<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" preserveAspectRatio="xMidYMid meet" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
<title>数轴上：坐标、距离、中点</title>
<desc>A 在 −3，B 在 5。距离 AB = |5 − (−3)| = 8；中点在 1，因为 1 到 −3 与 1 到 5 都是 4 个单位。</desc>
<rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
<line x1="40" y1="150" x2="664" y2="150" stroke="#1f2430" stroke-width="2"/>
<path d="M664,150 L655,145.4 L655,154.6 Z" fill="#1f2430"/>
<line x1="20" y1="144" x2="20" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="20" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">-5</text>
<line x1="66" y1="144" x2="66" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="66" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">-4</text>
<line x1="112" y1="144" x2="112" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="112" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">-3</text>
<line x1="158" y1="144" x2="158" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="158" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">-2</text>
<line x1="204" y1="144" x2="204" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="204" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">-1</text>
<line x1="250" y1="144" x2="250" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="250" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">0</text>
<line x1="296" y1="144" x2="296" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="296" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">1</text>
<line x1="342" y1="144" x2="342" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="342" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">2</text>
<line x1="388" y1="144" x2="388" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="388" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">3</text>
<line x1="434" y1="144" x2="434" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="434" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">4</text>
<line x1="480" y1="144" x2="480" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="480" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">5</text>
<line x1="526" y1="144" x2="526" y2="156" stroke="#1f2430" stroke-width="1.5"/>
<text x="526" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">6</text>
<circle cx="112" cy="150" r="5.5" fill="#2f5d8a"/>
<circle cx="480" cy="150" r="5.5" fill="#c0392b"/>
<circle cx="296" cy="150" r="5.5" fill="#27795b"/>
<text x="112" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#2f5d8a" font-weight="600" text-anchor="middle">A</text>
<text x="480" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#c0392b" font-weight="600" text-anchor="middle">B</text>
<text x="296" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#27795b" font-weight="600" text-anchor="middle">M</text>
<line x1="112" y1="106" x2="480" y2="106" stroke="#1f2430" stroke-width="1.6"/>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="241.5" y="98" font-size="12.5" fill="#1f2430">AB = |5 − (−3)| = 8</text></g>
<line x1="112" y1="212" x2="296" y2="212" stroke="#27795b" stroke-width="1.8"/>
<line x1="296" y1="212" x2="480" y2="212" stroke="#27795b" stroke-width="1.8"/>
<text x="204" y="228" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#27795b" font-weight="600" text-anchor="middle">4</text>
<text x="388" y="228" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#27795b" font-weight="600" text-anchor="middle">4</text>
<text x="40" y="34" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#1f2430" font-weight="600">同一个 −3：当坐标时带方向，当距离时只留长短</text>
<text x="40" y="56" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">A 的坐标是 −3（在原点左边）；点 A 到原点的距离是 3。</text>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="40" y="262" font-size="13" fill="#27795b" font-weight="600">M = (−3 + 5) ÷ 2 = 1</text></g>
<text x="40" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">中点把 AB 分成两段一样长：1 到两头都是 4。</text>
</svg>
