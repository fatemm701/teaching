<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" preserveAspectRatio="xMidYMid meet" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
<title>绝对值就是到原点的距离</title>
<desc>|5| = 5 表示 5 距离原点 5 格；|−3| = 3 表示 −3 距离原点 3 格。距离没有负数。</desc>
<rect x="0" y="0" width="720" height="280" fill="#ffffff"/>
<line x1="40" y1="176" x2="680" y2="176" stroke="#1f2430" stroke-width="2"/>
<path d="M680,176 L671,171.4 L671,180.6 Z" fill="#1f2430"/>
<line x1="60" y1="170" x2="60" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="60" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">-5</text>
<line x1="120" y1="170" x2="120" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="120" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">-4</text>
<line x1="180" y1="170" x2="180" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="180" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">-3</text>
<line x1="240" y1="170" x2="240" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="240" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">-2</text>
<line x1="300" y1="170" x2="300" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="300" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">-1</text>
<line x1="360" y1="170" x2="360" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="360" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">0</text>
<line x1="420" y1="170" x2="420" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="420" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">1</text>
<line x1="480" y1="170" x2="480" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="480" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">2</text>
<line x1="540" y1="170" x2="540" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="540" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">3</text>
<line x1="600" y1="170" x2="600" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="600" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">4</text>
<line x1="660" y1="170" x2="660" y2="182" stroke="#1f2430" stroke-width="1.5"/>
<text x="660" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">5</text>
<circle cx="360" cy="176" r="5" fill="#1f2430"/>
<path d="M360,126 L660,126" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<path d="M360,126 l8,-4 M360,126 l8,4" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<text x="660" y="126" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#c0392b" font-weight="600">|5| = 5</text>
<text x="510" y="114" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">往右走 5 格</text>
<path d="M360,228 L180,228" fill="none" stroke="#2f5d8a" stroke-width="2.4"/>
<path d="M360,228 l8,-4 M360,228 l8,4" fill="none" stroke="#2f5d8a" stroke-width="1.6"/>
<text x="180" y="228" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#2f5d8a" font-weight="600" text-anchor="end">|−3| = 3</text>
<text x="270" y="246" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">往左走 3 格</text>
<text x="40" y="34" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#1f2430" font-weight="600">绝对值 = 到原点的距离</text>
<text x="40" y="56" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">负号说的是「往哪边走」，绝对值量的是「走了多远」。</text>
<text x="40" y="74" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">所以 |−3| 不是 −3，而是 3：距离永远没有负的。</text>
</svg>
