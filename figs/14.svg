<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" preserveAspectRatio="xMidYMid meet" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
<title>中点 m 把 a 到 b 分成一样长的两段</title>
<desc>全长是 b − a；m 是中点，所以 a 到 m 与 m 到 b 长度相等，各占一半；m 就是 a 和 b 的平均数 (a+b)/2。</desc>
<rect x="0" y="0" width="720" height="280" fill="#ffffff"/>
<line x1="40" y1="150" x2="680" y2="150" stroke="#1f2430" stroke-width="2"/>
<path d="M680,150 L671,145.4 L671,154.6 Z" fill="#1f2430"/>
<circle cx="160" cy="150" r="6" fill="#2f5d8a"/>
<text x="160" y="178" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#2f5d8a" font-weight="600" text-anchor="middle">a</text>
<circle cx="360" cy="150" r="6" fill="#27795b"/>
<text x="360" y="178" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#27795b" font-weight="600" text-anchor="middle">m</text>
<circle cx="560" cy="150" r="6" fill="#c0392b"/>
<text x="560" y="178" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#c0392b" font-weight="600" text-anchor="middle">b</text>
<line x1="160" y1="98" x2="560" y2="98" stroke="#1f2430" stroke-width="1.4"/>
<line x1="160" y1="104" x2="160" y2="92" stroke="#1f2430" stroke-width="1.4"/>
<line x1="560" y1="104" x2="560" y2="92" stroke="#1f2430" stroke-width="1.4"/>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="371.94" y="90" font-size="12.5" fill="#1f2430">全长 b − a</text></g>
<line x1="160" y1="200" x2="360" y2="200" stroke="#2f5d8a" stroke-width="2.4"/>
<line x1="360" y1="200" x2="560" y2="200" stroke="#c0392b" stroke-width="2.4"/>
<text x="260" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#2f5d8a" text-anchor="middle">a 到 m</text>
<text x="460" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">m 到 b</text>
<text x="260" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">一样长</text>
<text x="460" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">一样长</text>
<text x="40" y="34" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13.5" fill="#1f2430" font-weight="600">两边各走一半，落脚的地方就是中点</text>
<text x="40" y="56" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">中点不是「差不多中间」，是「两段严格一样长」。</text>
<g font-family="'Cambria Math',Cambria,'Times New Roman','Microsoft YaHei',serif"><text x="40" y="226" font-size="14" fill="#27795b" font-weight="600">m = (a + b) ÷ 2</text></g>
<text x="40" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b6472">也就是 a 和 b 的平均数。</text>
</svg>
